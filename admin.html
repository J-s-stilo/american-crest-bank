<script>
/*
=========================================================
AMERICAN CREST BANK — ADMIN CONTROLLER
FIXED REQUEST HANDLING
=========================================================
*/

const API = "";

const ADMIN_TOKEN_KEY = "acb_admin_token";

let token = localStorage.getItem(ADMIN_TOKEN_KEY) || null;

let selectedCustomer = null;
let selectedTicket = null;


/* =========================
   BASIC HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setLoginError(message){
  const box = $("loginError");

  box.textContent = message || "";

  if(message){
    box.classList.add("show");
  }else{
    box.classList.remove("show");
  }
}

function setLoginStatus(message){
  $("loginStatus").textContent = message || "";
}


/* =========================
   API REQUEST
   FIXED
========================= */

async function api(endpoint, options = {}){

  const requestOptions = {
    ...options,
    headers: {
      ...(options.headers || {})
    }
  };

  /*
    Only add JSON content type when a body exists.
    This prevents some servers/proxies from rejecting
    GET and PATCH requests unnecessarily.
  */
  if(requestOptions.body !== undefined){
    requestOptions.headers["Content-Type"] =
      "application/json";
  }

  if(token){
    requestOptions.headers["Authorization"] =
      "Bearer " + token;
  }

  let response;

  try{

    response = await fetch(
      API + endpoint,
      requestOptions
    );

  }catch(error){

    throw new Error(
      "Unable to connect to the server. Check that the website server/API is running."
    );

  }


  /*
    Read the response safely.

    Some servers return JSON.
    Some return plain text.
    The old code only handled JSON, which could hide
    the actual server error.
  */

  const contentType =
    response.headers.get("content-type") || "";

  let data = null;
  let rawText = "";

  try{

    if(contentType.includes("application/json")){

      data = await response.json();

    }else{

      rawText = await response.text();

      if(rawText){

        try{
          data = JSON.parse(rawText);
        }catch{
          data = {
            message: rawText
          };
        }

      }else{

        data = {};

      }

    }

  }catch{

    data = {};

  }


  /*
    Authentication failure.
  */

  if(
    response.status === 401 ||
    response.status === 403
  ){

    token = null;

    localStorage.removeItem(
      ADMIN_TOKEN_KEY
    );

    if(
      $("adminApp") &&
      $("adminApp").style.display !== "none"
    ){
      showLoginScreen();
    }

    throw new Error(
      data?.error ||
      data?.message ||
      "Administrator authorization failed."
    );

  }


  /*
    Endpoint does not exist.
  */

  if(response.status === 404){

    throw new Error(
      data?.error ||
      data?.message ||
      (
        "Server endpoint not found: " +
        endpoint
      )
    );

  }


  /*
    Any other server error.
  */

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      data?.detail ||
      rawText ||
      (
        "Request failed (" +
        response.status +
        ")."
      )
    );

  }


  return data;

}


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  const email =
    $("adminEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    $("adminPassword")
      .value;

  setLoginError("");
  setLoginStatus("");

  if(!email){

    setLoginError(
      "Enter the administrator email."
    );

    return;
  }

  if(!password){

    setLoginError(
      "Enter the administrator password."
    );

    return;
  }


  const button = $("loginButton");

  button.disabled = true;
  button.textContent = "Signing in...";


  try{

    let data = null;


    /*
      First try the dedicated admin endpoint.
    */

    try{

      data = await api(
        "/api/admin/login",
        {
          method:"POST",
          body:JSON.stringify({
            email,
            password
          })
        }
      );

    }catch(firstError){

      /*
        If the dedicated endpoint doesn't exist,
        try the existing general login endpoint.

        We ONLY use the returned account if its role
        is administrator.
      */

      if(
        String(firstError.message)
          .toLowerCase()
          .includes("not found") ||
        String(firstError.message)
          .includes("404")
      ){

        data = await api(
          "/api/login",
          {
            method:"POST",
            body:JSON.stringify({
              email,
              password
            })
          }
        );

      }else{

        throw firstError;

      }

    }


    if(!data){

      throw new Error(
        "The server returned an empty response."
      );

    }


    if(!data.token){

      throw new Error(
        data.error ||
        data.message ||
        "The server did not return a login session."
      );

    }


    /*
      Accept common server response structures.
    */

    const user =
      data.user ||
      data.admin ||
      data.account ||
      null;


    const role =
      user?.role ||
      data.role ||
      "";


    if(
      String(role).toLowerCase() !== "admin" &&
      String(role).toLowerCase() !== "administrator"
    ){

      throw new Error(
        "This account does not have administrator privileges."
      );

    }


    token = data.token;

    localStorage.setItem(
      ADMIN_TOKEN_KEY,
      token
    );


    showAdmin();

  }catch(error){

    token = null;

    localStorage.removeItem(
      ADMIN_TOKEN_KEY
    );

    setLoginError(
      error.message ||
      "Unable to sign in."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Sign In";

  }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  $("loginScreen")
    .style
    .display = "none";

  $("adminApp")
    .style
    .display = "block";

  setLoginError("");
  setLoginStatus("");

  loadDashboard();
  loadCustomers();
  loadTransfers();
  loadSupport();
  loadNotifications();

}


/* =========================
   SHOW LOGIN
========================= */

function showLoginScreen(){

  $("adminApp")
    .style
    .display = "none";

  $("loginScreen")
    .style
    .display = "flex";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  token = null;

  localStorage.removeItem(
    ADMIN_TOKEN_KEY
  );

  selectedCustomer = null;
  selectedTicket = null;

  showLoginScreen();

  $("adminEmail").value = "";
  $("adminPassword").value = "";

}


/* =========================
   PANELS
========================= */

function showPanel(id,button){

  document
    .querySelectorAll(".panel")
    .forEach(panel =>
      panel.classList.remove(
        "active-panel"
      )
    );

  const target = $(id);

  if(target){
    target.classList.add(
      "active-panel"
    );
  }

  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList.remove(
        "active-tab"
      )
    );

  if(button){
    button.classList.add(
      "active-tab"
    );
  }

}


/* =========================
   REFRESH
========================= */

async function refreshAll(){

  await Promise.allSettled([
    loadDashboard(),
    loadCustomers(),
    loadTransfers(),
    loadSupport(),
    loadNotifications()
  ]);

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

  try{

    const data =
      await api(
        "/api/admin/summary"
      );


    $("customerCount").textContent =
      data.customers ??
      data.customerCount ??
      0;


    const balances =
      Array.isArray(data.balances)
        ? data.balances
        : [];


    if(!balances.length){

      $("balanceTotal").textContent =
        "No funds";

    }else{

      $("balanceTotal").innerHTML =
        balances.map(item => {

          const currency =
            escapeHtml(
              item.currency
            );

          const total =
            Number(
              item.total ??
              item.balance ??
              0
            ).toLocaleString(
              undefined,
              {
                minimumFractionDigits:2
              }
            );

          return `
            <div class="balance-item">
              ${currency} ${total}
            </div>
          `;

        }).join("");

    }


    $("pendingCount").textContent =
      data.pendingTransfers ??
      data.pending_transfers ??
      0;


    $("supportCount").textContent =
      data.openSupport ??
      data.open_support ??
      0;


  }catch(error){

    console.error(
      "Dashboard error:",
      error
    );

  }

}


/* =========================
   BALANCE FORMAT
========================= */

function formatAccounts(accounts){

  if(
    !Array.isArray(accounts) ||
    !accounts.length
  ){
    return "No funds";
  }

  return `
    <div class="balance-list">

      ${
        accounts.map(account => {

          const currency =
            escapeHtml(
              account.currency || ""
            );

          const amount =
            Number(
              account.balance || 0
            ).toLocaleString(
              undefined,
              {
                minimumFractionDigits:2
              }
            );

          return `
            <div class="balance-item">
              ${currency} ${amount}
            </div>
          `;

        }).join("")
      }

    </div>
  `;

}


/* =========================
   CUSTOMERS
========================= */

async function loadCustomers(){

  const body =
    $("customerTable");

  body.innerHTML = `
    <tr>
      <td colspan="6" class="empty">
        Loading customers...
      </td>
    </tr>
  `;


  try{

    const result =
      await api(
        "/api/admin/customers"
      );


    /*
      Support servers that return:
      [...]
      {customers:[...]}
      {data:[...]}
    */

    const customers =
      Array.isArray(result)
        ? result
        : (
            Array.isArray(result?.customers)
              ? result.customers
              : (
                  Array.isArray(result?.data)
                    ? result.data
                    : []
                )
          );


    if(!customers.length){

      body.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            No customer accounts yet.
          </td>
        </tr>
      `;

      return;

    }


    body.innerHTML =
      customers.map(customer => {

        const status =
          String(
            customer.status || "active"
          ).toLowerCase();


        const statusClass =
          status === "suspended"
            ? "suspended"
            : status === "pending"
              ? "pending"
              : "active";


        const customerId =
          Number(customer.id);


        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(
                  customer.full_name ||
                  customer.name ||
                  "Customer"
                )}
              </strong>
            </td>

            <td>
              ${escapeHtml(
                customer.email || ""
              )}
            </td>

            <td>
              ${formatAccounts(
                customer.accounts
              )}
            </td>

            <td>
              <span class="badge ${statusClass}">
                ${escapeHtml(status)}
              </span>
            </td>

            <td>
              ${
                customer.created_at
                  ? new Date(
                      customer.created_at
                    ).toLocaleDateString()
                  : "—"
              }
            </td>

            <td>

              <div class="actions">

                <button
                  class="primary"
                  onclick="openCreditById(${customerId})"
                >
                  Add Funds
                </button>

                ${
                  status !== "active"
                  ?
                  `
                  <button
                    class="success"
                    onclick="changeStatus(
                      ${customerId},
                      'active'
                    )"
                  >
                    Activate
                  </button>
                  `
                  :
                  `
                  <button
                    class="danger"
                    onclick="changeStatus(
                      ${customerId},
                      'suspended'
                    )"
                  >
                    Suspend
                  </button>
                  `
                }

              </div>

            </td>

          </tr>
        `;

      }).join("");


    /*
      Store customers safely for Add Funds.
    */

    window.__adminCustomers =
      customers;


  }catch(error){

    body.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          ${escapeHtml(
            error.message
          )}
        </td>
      </tr>
    `;

  }

}


/* =========================
   OPEN CREDIT
========================= */

function openCreditById(id){

  const customers =
    window.__adminCustomers || [];

  const customer =
    customers.find(
      item =>
        Number(item.id) === Number(id)
    );

  if(!customer){

    alert(
      "Customer information could not be found. Refresh customers and try again."
    );

    return;

  }

  openCredit(customer);

}


function openCredit(customer){

  selectedCustomer =
    customer;

  $("creditCustomerName")
    .textContent =
      (
        customer.full_name ||
        customer.name ||
        "Customer"
      ) +
      " — " +
      getCustomerBalanceText(
        customer.accounts
      );

  $("creditAmount").value = "";

  $("creditNote").value =
    "Administrator account funding";

  $("creditModal")
    .classList
    .add("show");

}


function getCustomerBalanceText(accounts){

  if(
    !Array.isArray(accounts) ||
    !accounts.length
  ){
    return "Current balance: No funds";
  }

  const text =
    accounts.map(account => {

      const currency =
        escapeHtml(
          account.currency || ""
        );

      const amount =
        Number(
          account.balance || 0
        ).toLocaleString(
          undefined,
          {
            minimumFractionDigits:2
          }
        );

      return currency +
        " " +
        amount;

    }).join(" • ");


  return "Current balance: " + text;

}


function closeModal(){

  $("creditModal")
    .classList
    .remove("show");

}


/* =========================
   ADD FUNDS
========================= */

async function creditCustomer(){

  if(!selectedCustomer){

    alert(
      "Select a customer first."
    );

    return;

  }


  const currency =
    $("creditCurrency")
      .value
      .toUpperCase();


  const amount =
    Number(
      $("creditAmount")
        .value
    );


  const description =
    $("creditNote")
      .value
      .trim();


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    alert(
      "Enter a valid amount."
    );

    return;

  }


  if(amount > 1000000000){

    alert(
      "The amount is too large."
    );

    return;

  }


  const customerName =
    selectedCustomer.full_name ||
    selectedCustomer.name ||
    "this customer";


  if(
    !confirm(
      "Add " +
      currency +
      " " +
      amount.toLocaleString() +
      " to " +
      customerName +
      "?"
    )
  ){
    return;
  }


  try{

    const result =
      await api(
        "/api/admin/customers/" +
        encodeURIComponent(
          selectedCustomer.id
        ) +
        "/funds",
        {
          method:"POST",

          body:JSON.stringify({
            amount,
            currency,
            description:
              description ||
              "Administrator account funding"
          })
        }
      );


    alert(
      result?.message ||
      "Customer account funded successfully."
    );


    closeModal();

    await loadCustomers();
    await loadDashboard();


  }catch(error){

    alert(
      error.message ||
      "Unable to add funds."
    );

  }

}


/* =========================
   CUSTOMER STATUS
========================= */

async function changeStatus(
  id,
  status
){

  if(!id){

    alert(
      "Invalid customer."
    );

    return;

  }


  if(
    !confirm(
      "Change this customer's account status to " +
      status +
      "?"
    )
  ){
    return;
  }


  try{

    await api(
      "/api/admin/customers/" +
      encodeURIComponent(id) +
      "/status",
      {
        method:"PATCH",

        body:JSON.stringify({
          status
        })
      }
    );


    await loadCustomers();
    await loadDashboard();


  }catch(error){

    alert(
      error.message ||
      "Unable to change account status."
    );

  }

}


/* =========================
   TRANSFERS
========================= */

async function loadTransfers(){

  const body =
    $("transferTable");

  body.innerHTML = `
    <tr>
      <td colspan="7" class="empty">
        Loading transfers...
      </td>
    </tr>
  `;


  try{

    const result =
      await api(
        "/api/admin/transfers"
      );


    const transfers =
      Array.isArray(result)
        ? result
        : (
            Array.isArray(result?.transfers)
              ? result.transfers
              : (
                  Array.isArray(result?.data)
                    ? result.data
                    : []
                )
          );


    if(!transfers.length){

      body.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No transfer requests.
          </td>
        </tr>
      `;

      return;

    }


    body.innerHTML =
      transfers.map(t => {

        const status =
          String(
            t.status || "pending"
          ).toLowerCase();


        let badgeClass =
          "pending";


        if(
          status === "successful" ||
          status === "approved"
        ){
          badgeClass =
            "success-badge";
        }else if(
          status === "declined"
        ){
          badgeClass =
            "declined";
        }


        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(
                  t.full_name ||
                  "Customer"
                )}
              </strong>

              <br>

              <small>
                ${escapeHtml(
                  t.email || ""
                )}
              </small>
            </td>

            <td>
              ${Number(
                t.amount || 0
              ).toLocaleString(
                undefined,
                {
                  minimumFractionDigits:2
                }
              )}
            </td>

            <td>
              ${escapeHtml(
                t.currency || "—"
              )}
            </td>

            <td>
              ${escapeHtml(
                t.recipient || "—"
              )}
            </td>

            <td>
              ${escapeHtml(
                t.reference || "—"
              )}
            </td>

            <td>
              <span class="badge ${badgeClass}">
                ${escapeHtml(status)}
              </span>
            </td>

            <td>

              ${
                status === "pending"
                ?
                `
                <div class="actions">

                  <button
                    class="success"
                    onclick="updateTransfer(
                      ${Number(t.id)},
                      'successful'
                    )"
                  >
                    Approve
                  </button>

                  <button
                    class="danger"
                    onclick="updateTransfer(
                      ${Number(t.id)},
                      'declined'
                    )"
                  >
                    Decline
                  </button>

                </div>
                `
                :
                "—"
              }

            </td>

          </tr>
        `;

      }).join("");


  }catch(error){

    body.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          ${escapeHtml(
            error.message
          )}
        </td>
      </tr>
    `;

  }

}


/* =========================
   UPDATE TRANSFER
========================= */

async function updateTransfer(
  id,
  status
){

  if(!id){

    alert(
      "Invalid transfer."
    );

    return;

  }


  if(
    !confirm(
      "Set this transfer to " +
      status +
      "?"
    )
  ){
    return;
  }


  try{

    await api(
      "/api/admin/transfers/" +
      encodeURIComponent(id) +
      "/status",
      {
        method:"PATCH",

        body:JSON.stringify({
          status
        })
      }
    );


    await loadTransfers();
    await loadDashboard();


  }catch(error){

    alert(
      error.message ||
      "Unable to update transfer."
    );

  }

}


/* =========================
   SUPPORT
========================= */

async function loadSupport(){

  const body =
    $("supportTable");

  body.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Loading support requests...
      </td>
    </tr>
  `;


  try{

    const result =
      await api(
        "/api/admin/support"
      );


    const tickets =
      Array.isArray(result)
        ? result
        : (
            Array.isArray(result?.tickets)
              ? result.tickets
              : (
                  Array.isArray(result?.support)
                    ? result.support
                    : (
                        Array.isArray(result?.data)
                          ? result.data
                          : []
                      )
                )
          );


    if(!tickets.length){

      body.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            No support requests.
          </td>
        </tr>
      `;

      return;

    }


    body.innerHTML =
      tickets.map(ticket => {

        const status =
          String(
            ticket.status || "pending"
          ).toLowerCase();


        const badge =
          status === "answered"
            ? "success-badge"
            : "pending";


        return `
          <tr>

            <td>

              ${escapeHtml(
                ticket.full_name ||
                "Customer"
              )}

              <br>

              <small>
                ${escapeHtml(
                  ticket.email || ""
                )}
              </small>

            </td>

            <td>
              ${escapeHtml(
                ticket.subject ||
                "Support"
              )}
            </td>

            <td>
              ${escapeHtml(
                ticket.message || ""
              )}
            </td>

            <td>

              <span class="badge ${badge}">
                ${escapeHtml(status)}
              </span>

            </td>

            <td>

              <button
                class="primary"
                onclick="openReply(
                  ${Number(ticket.id)}
                )"
              >
                Reply
              </button>

            </td>

          </tr>
        `;

      }).join("");


  }catch(error){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          ${escapeHtml(
            error.message
          )}
        </td>
      </tr>
    `;

  }

}


/* =========================
   REPLY
========================= */

function openReply(ticketId){

  selectedTicket =
    ticketId;

  $("replyMessage")
    .value = "";

  $("replyModal")
    .classList
    .add("show");

}


function closeReplyModal(){

  $("replyModal")
    .classList
    .remove("show");

  selectedTicket =
    null;

}


async function sendReply(){

  const message =
    $("replyMessage")
      .value
      .trim();


  if(!message){

    alert(
      "Enter a response."
    );

    return;

  }


  if(!selectedTicket){

    alert(
      "No support ticket selected."
    );

    return;

  }


  try{

    const result =
      await api(
        "/api/admin/support/" +
        encodeURIComponent(
          selectedTicket
        ) +
        "/reply",
        {
          method:"POST",

          body:JSON.stringify({
            message
          })
        }
      );


    closeReplyModal();

    await loadSupport();
    await loadDashboard();


    alert(
      result?.message ||
      "Response sent."
    );


  }catch(error){

    alert(
      error.message ||
      "Unable to send response."
    );

  }

}


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

  const box =
    $("notificationList");

  box.innerHTML =
    "Loading notifications...";


  try{

    const result =
      await api(
        "/api/admin/notifications"
      );


    const notifications =
      Array.isArray(result)
        ? result
        : (
            Array.isArray(result?.notifications)
              ? result.notifications
              : (
                  Array.isArray(result?.data)
                    ? result.data
                    : []
                )
          );


    if(!notifications.length){

      box.innerHTML =
        "No notifications.";

      return;

    }


    box.innerHTML =
      notifications.map(n => {

        const opacity =
          n.is_read
            ? ".6"
            : "1";


        return `
          <div
            style="
              padding:14px 0;
              border-bottom:1px solid #edf0f5;
              opacity:${opacity};
            "
          >

            <strong>
              ${escapeHtml(
                n.title ||
                "Notification"
              )}
            </strong>

            <p>
              ${escapeHtml(
                n.message || ""
              )}
            </p>

            <small>
              ${
                n.created_at
                  ? new Date(
                      n.created_at
                    ).toLocaleString()
                  : ""
              }
            </small>

            ${
              !n.is_read
              ?
              `
              <br><br>

              <button
                class="secondary"
                onclick="markNotification(
                  ${Number(n.id)}
                )"
              >
                Mark as read
              </button>
              `
              :
              ""
            }

          </div>
        `;

      }).join("");


  }catch(error){

    box.innerHTML =
      escapeHtml(
        error.message ||
        "Unable to load notifications."
      );

  }

}


/* =========================
   MARK NOTIFICATION READ
========================= */

async function markNotification(id){

  try{

    await api(
      "/api/admin/notifications/" +
      encodeURIComponent(id) +
      "/read",
      {
        method:"PATCH"
      }
    );

    await loadNotifications();

  }catch(error){

    alert(
      error.message ||
      "Unable to update notification."
    );

  }

}
